<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Learn &amp; Practice</title>
<style>
:root{--bg:#f7f7f5;--sf:#fff;--tx:#1f2328;--mu:#6b7280;--bd:#e2e2dc;--ac:#2f6fed;--ok:#1a7f4b;--bad:#c0392b;--cd:#f0f0ec;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15171a;--sf:#1e2126;--tx:#e8e8e6;--mu:#9aa0a8;--bd:#33373d;--ac:#6c9bff;--ok:#4cc38a;--bad:#ff7b6b;--cd:#272b31;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#15171a;--sf:#1e2126;--tx:#e8e8e6;--mu:#9aa0a8;--bd:#33373d;--ac:#6c9bff;--ok:#4cc38a;--bad:#ff7b6b;--cd:#272b31;color-scheme:dark}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif}
header{padding:14px 18px;border-bottom:1px solid var(--bd);background:var(--sf);display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
h1{font-size:18px;margin:0}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
button{font:inherit;cursor:pointer;border:1px solid var(--bd);background:var(--sf);color:var(--tx);padding:7px 13px;border-radius:8px}
button:hover{border-color:var(--ac)}
button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.wrap{display:grid;grid-template-columns:240px 1fr 320px;gap:18px;max-width:1440px;margin:0 auto;padding:18px}
@media(max-width:1100px){.wrap{grid-template-columns:240px 1fr}#ai{grid-column:1/-1}}@media(max-width:760px){.wrap{grid-template-columns:1fr}}
#ai{position:sticky;top:10px}#ai button{display:inline-block;width:auto;text-align:center;border:1px solid var(--bd);background:var(--sf);padding:6px 11px;font-size:14px}#ai textarea{min-height:56px;font-family:inherit;margin:8px 0 4px}
#log{max-height:360px;overflow-y:auto;display:flex;flex-direction:column;gap:8px;margin:8px 0}.m{padding:8px 10px;border-radius:10px;background:var(--cd);white-space:pre-wrap;font-size:14px}.m.u{background:var(--ac);color:#fff;align-self:flex-end}
aside{background:var(--sf);border:1px solid var(--bd);border-radius:12px;padding:12px;align-self:start}
.lv{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--mu);margin:12px 6px 4px}
.lv:first-of-type{margin-top:2px}
aside button{display:block;width:100%;text-align:left;border:0;background:none;padding:8px 10px}
aside button.on{background:var(--cd);color:var(--tx);font-weight:600}
.bar{height:6px;background:var(--cd);border-radius:4px;margin:8px 6px 0;overflow:hidden}.bar i{display:block;height:100%;background:var(--ok);width:0}
main{background:var(--sf);border:1px solid var(--bd);border-radius:12px;padding:20px;min-width:0}
main h2{margin:0 0 4px}.badge{font-size:12px;color:var(--mu)}
pre,textarea{font:14px/1.5 ui-monospace,Menlo,Consolas,monospace;background:var(--cd);color:var(--tx);border:1px solid var(--bd);border-radius:8px;padding:12px;margin:8px 0;width:100%;overflow-x:auto}
textarea{min-height:170px;resize:vertical}
.task{border-left:4px solid var(--ac);padding:6px 14px;background:var(--cd);border-radius:0 8px 8px 0;margin:14px 0}
.row{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0}
.guide{border:1px dashed var(--bd);border-radius:8px;padding:10px 14px;margin-top:12px}
.guide p{margin:6px 0}
.res{margin-top:10px}.ok{color:var(--ok)}.bad{color:var(--bad)}
iframe{width:100%;height:220px;border:1px solid var(--bd);border-radius:8px;background:#fff;margin-top:8px}
code{background:var(--cd);padding:1px 5px;border-radius:4px}
</style>
</head>

{lv:'Basics',t:'Variables & print',b:'Python needs no type declarations. Assign with <code>=</code> and show values with <code>print()</code>.',ex:'name = "Ana"\nprint("Hello,", name)',task:'Create a variable <code>age</code> and print a sentence that includes it.',st:'# your code here\n',h:['Assign: age = 20','Call print(...) with text and the variable.','print("I am", age, "years old")'],c:[[/\bage\s*=/,'Create the variable age'],[/print\s*\(/,'Call print()'],[/print\s*\([^)]*\bage\b/,'Include age inside print()']],exp:'I am 20 years old'},
{lv:'Fundamentals',t:'Functions & loops',b:'Functions use <code>def</code> and <code>return</code>. Indentation defines blocks.',ex:'def greet(n):\n    return "Hi " + n\nfor i in range(3):\n    print(greet("Bo"), i)',task:'Define <code>square(n)</code> that returns <code>n * n</code>, then print <code>square(4)</code>.',st:'# your code here\n',h:['def square(n):','Indent the next line: return n * n','print(square(4))'],c:[[/def\s+square\s*\(\s*n\s*\)\s*:/,'Define def square(n):'],[/return\s+n\s*\*\s*n|return\s+n\s*\*\*\s*2/,'Return n * n'],[/print\s*\(\s*square\s*\(\s*4\s*\)\s*\)/,'Print square(4)']],exp:'16'},
{lv:'Advanced',t:'List comprehensions',b:'A comprehension builds a list in one expression: <code>[expr for x in items if condition]</code>.',ex:'nums = [1, 2, 3, 4]\nprint([n * 10 for n in nums])',task:'From <code>range(10)</code>, build a list of only the even numbers with a comprehension and print it.',st:'# your code here\n',h:['Shape: [n for n in range(10) if ...]','Even means n % 2 == 0','print([n for n in range(10) if n % 2 == 0])'],c:[[/\[\s*[^\]]*for\s+\w+\s+in\s+range\s*\(\s*10\s*\)/,'Loop over range(10) inside [ ]'],[/if\s+\w+\s*%\s*2\s*==\s*0/,'Filter evens with % 2 == 0'],[/print/,'Print the list']],exp:'[0, 2, 4, 6, 8]'}]},

{lv:'Fundamentals',t:'Styling with CSS',b:'CSS goes in a <code>&lt;style&gt;</code> block. A rule is <code>selector { property: value; }</code>.',ex:'&lt;style&gt;\n  p { color: gray; }\n&lt;/style&gt;',task:'Make the <code>h1</code> blue and centered using a style block.',st:'<style>\n  \n</style>\n<h1>Styled title</h1>\n',h:['Select the element: h1 { ... }','color: blue;','Add text-align: center; too.'],c:[[/<style/i,'Use a <style> block'],[/h1\s*\{[^}]*color\s*:/i,'Set color on h1'],[/text-align\s*:\s*center/i,'Center with text-align']]},
{lv:'Advanced',t:'Flexbox layout',b:'Flexbox arranges children in a row or column. Set <code>display:flex</code> on the parent and use <code>gap</code> for spacing.',ex:'.row { display:flex; gap:12px; }',task:'Make a flex container with 3 card <code>div</code>s inside, with a gap between them.',st:'<style>\n  .row { }\n  .card { background:#ddd; padding:16px; }\n</style>\n<div class="row">\n  \n</div>\n',h:['Add display: flex; to .row','Add gap: 12px; to .row','Put three <div class="card">Card</div> inside .row'],c:[[/display\s*:\s*flex/i,'Use display:flex'],[/gap\s*:/i,'Add a gap'],[/(<div[^>]*class="card"[\s\S]*){3}/i,'Add 3 card divs']]}]},
sql:{name:'SQL',ls:[

{lv:'Fundamentals',t:'WHERE & ORDER BY',b:'<code>WHERE</code> filters rows, <code>ORDER BY</code> sorts them. Add <code>DESC</code> for high to low.',ex:"SELECT * FROM products WHERE category = 'toys';",task:'Select all products priced over 10, sorted by price from highest to lowest.',st:'-- your query here\n',h:['SELECT * FROM products','WHERE price > 10','ORDER BY price DESC;'],c:[[/from\s+products/i,'Query the products table'],[/where\s+price\s*>\s*10/i,'Filter with WHERE price > 10'],[/order\s+by\s+price\s+desc/i,'Sort with ORDER BY price DESC']],exp:'Products over 10, most expensive first'},
{lv:'Advanced',t:'JOIN & GROUP BY',b:'<code>JOIN</code> combines tables on a matching key. <code>GROUP BY</code> with aggregates like <code>COUNT</code> summarizes rows. Tables: <code>customers(id, name)</code>, <code>orders(id, customer_id)</code>.',ex:'SELECT c.name, COUNT(o.id)\nFROM customers c\nJOIN orders o ON o.customer_id = c.id\nGROUP BY c.name;',task:'Show each customer name with the number of their orders.',st:'-- your query here\n',h:['Join: FROM customers c JOIN orders o ON o.customer_id = c.id','Select c.name and COUNT(o.id)','Finish with GROUP BY c.name;'],c:[[/join\s+orders/i,'JOIN the orders table'],[/on\s+[\w.]*customer_id\s*=\s*[\w.]*id|on\s+[\w.]*id\s*=\s*[\w.]*customer_id/i,'Match customer_id with id'],[/count\s*\(/i,'Use COUNT()'],[/group\s+by/i,'Use GROUP BY']],exp:'One row per customer with an order count'}]}
};
const add=(k,b,f)=>{D[k].ls.splice(1,0,b);D[k].ls.splice(2,0,f)};
add('js',{lv:'Basics',t:'Numbers & strings',b:'Numbers do math with + - * /. Strings are text, and <code>.length</code> tells you how many characters they hold.',ex:'console.log(6 * 7);\nconsole.log("hi".length);',task:'Log the number of characters in <code>"JavaScript"</code>.',st:'// your code here\n',h:['Write the string "JavaScript".','Add .length right after it.','console.log("JavaScript".length);'],c:[[/\.length/,'Use .length']],o:/^10$/m,sol:`console.log("JavaScript".length);||length counts the characters: 10.`},{lv:'Fundamentals',t:'Conditions & loops',b:'<code>for</code> repeats code and <code>if</code> runs code only when a condition is true. <code>n % 2 === 0</code> means n is even.',ex:'for (let i = 1; i <= 3; i++) {\n  console.log(i);\n}',task:'Loop from 1 to 5 and log only the even numbers.',st:'// your code here\n',h:['for (let i = 1; i <= 5; i++) { }','Inside the loop, test: if (i % 2 === 0) { }','Log i inside the if.'],c:[[/for\s*\(/,'Use a for loop'],[/if\s*\(/,'Use an if']],o:/^2\n4$/,sol:`for (let i = 1; i <= 5; i++) {\n  if (i % 2 === 0) console.log(i);\n}||The if skips odd numbers, so only 2 and 4 print.`});
add('py',{lv:'Basics',t:'Numbers & strings',b:'Python does math with + - * /. <code>len()</code> returns how long a piece of text is.',ex:'print(6 * 7)\nprint(len("hi"))',task:'Print the number of characters in <code>"Python"</code>.',st:'# your code here\n',h:['Use len("Python")','Wrap it in print(...)','print(len("Python"))'],c:[[/print\s*\(\s*len\s*\(\s*["']Python["']\s*\)\s*\)/,'Print len("Python")']],exp:'6',sol:`print(len("Python"))||len counts the characters and print shows the number.`},{lv:'Fundamentals',t:'If & for loops',b:'<code>for</code> repeats and <code>if</code> decides. <code>%</code> gives the remainder, so an odd number has <code>n % 2 == 1</code>.',ex:'for i in range(3):\n    print(i)',task:'Loop over <code>range(1, 6)</code> and print only the odd numbers.',st:'# your code here\n',h:['for i in range(1, 6):','Indent, then: if i % 2 == 1:','Indent again and print(i)'],c:[[/for\s+\w+\s+in\s+range\s*\(\s*1\s*,\s*6\s*\)/,'Loop with range(1, 6)'],[/if\s+\w+\s*%\s*2/,'Test with % 2'],[/print/,'Print the number']],exp:'1, 3, 5 (one per line)',sol:`for i in range(1, 6):\n    if i % 2 == 1:\n        print(i)||range(1, 6) gives 1 to 5 and the if keeps only odd values.`});
add('html',{lv:'Basics',t:'Lists & links',b:'<code>&lt;ul&gt;</code> makes a bullet list of <code>&lt;li&gt;</code> items. <code>&lt;a href="..."&gt;</code> makes a link.',ex:'&lt;ul&gt;&lt;li&gt;One&lt;/li&gt;&lt;/ul&gt;\n&lt;a href="https://example.com"&gt;Visit&lt;/a&gt;',task:'Make a list with 3 items and add one link.',st:'<!-- your HTML here -->\n',h:['<ul> ... </ul> wraps the list.','Put three <li>Item</li> lines inside it.','Add <a href="https://example.com">Link</a> below the list.'],c:[[/<ul[^>]*>(\s*<li[^>]*>[\s\S]*?<\/li>){3}/i,'A ul with 3 li items'],[/<a\s[^>]*href=/i,'A link with href']],sol:`<ul>\n  <li>One</li>\n  <li>Two</li>\n  <li>Three</li>\n</ul>\n<a href="https://example.com">Link</a>||ul holds li items, and href tells the link where to go.`},{lv:'Fundamentals',t:'The box model',b:'Every element is a box. <code>padding</code> is space inside the border, <code>border</code> is the edge and <code>margin</code> is space outside.',ex:'.box { padding: 10px; }',task:'Give <code>.box</code> padding, a border and a margin.',st:'<style>\n  .box { }\n</style>\n<div class="box">Hello</div>\n',h:['Add padding: 16px;','Add border: 2px solid gray;','Add margin: 20px;'],c:[[/padding\s*:/i,'Add padding'],[/border\s*:/i,'Add a border'],[/margin\s*:/i,'Add a margin']],sol:`<style>\n  .box { padding: 16px; border: 2px solid gray; margin: 20px; }\n</style>\n<div class="box">Hello</div>||Padding is inside the border, margin pushes other things away.`});
add('sql',{lv:'Basics',t:'Counting rows',b:'<code>COUNT(*)</code> returns how many rows there are.',ex:'SELECT COUNT(*) FROM products;',task:'Count the rows in <code>products</code>.',st:'-- your query here\n',h:['Start with SELECT COUNT(*)','Add FROM products','Finish with a semicolon.'],c:[[/select\s+count\s*\(\s*\*\s*\)\s+from\s+products/i,'SELECT COUNT(*) FROM products']],exp:'One number: how many products exist',sol:`SELECT COUNT(*) FROM products;||COUNT(*) counts every row in the table.`},{lv:'Fundamentals',t:'LIKE & AND',b:'<code>LIKE</code> matches patterns, where <code>%</code> means any characters. <code>AND</code> requires both conditions to be true.',ex:"SELECT * FROM products WHERE name LIKE 'B%';",task:'Select products whose name starts with A and whose price is under 20.',st:'-- your query here\n',h:["WHERE name LIKE 'A%'",'Add AND price < 20','Start the query with SELECT * FROM products'],c:[[/like\s+'a%'/i,"Use LIKE 'A%'"],[/\band\b/i,'Combine with AND'],[/price\s*<\s*20/i,'Add price < 20']],exp:'Cheap products whose names start with A',sol:`SELECT * FROM products\nWHERE name LIKE 'A%' AND price < 20;||Both conditions must be true for a row to appear.`});
const SOL={'Variables & console.log':`const name = "Ana";\nconsole.log("Hello, " + name + "!");||const stores the name and + joins the text.`,'Functions & arrays':`function double(n) { return n * 2; }\nconsole.log([1, 2, 3].map(double));||map calls double on every item.`,'Async / await':`async function job() {\n  await delay(200);\n  return "done";\n}\nconsole.log(await job());||await waits for delay to finish first.`,'Variables & print':`age = 20\nprint("I am", age, "years old")||print accepts several values.`,'Functions & loops':`def square(n):\n    return n * n\nprint(square(4))||return hands the result back to print.`,'List comprehensions':`print([n for n in range(10) if n % 2 == 0])||The if clause keeps only even numbers.`,'Headings & paragraphs':`<h1>My page</h1>\n<p>Welcome to my page.</p>||Each tag opens and closes around its text.`,'Styling with CSS':`<style>\n  h1 { color: blue; text-align: center; }\n</style>\n<h1>Styled title</h1>||One rule sets two properties on every h1.`,'Flexbox layout':`<style>\n  .row { display: flex; gap: 12px; }\n  .card { background:#ddd; padding:16px; }\n</style>\n<div class="row">\n  <div class="card">A</div>\n  <div class="card">B</div>\n  <div class="card">C</div>\n</div>||display:flex puts children in a row and gap spaces them.`,'SELECT':`SELECT name, price FROM products;||SELECT lists columns and FROM names the table.`,'WHERE & ORDER BY':`SELECT * FROM products\nWHERE price > 10\nORDER BY price DESC;||WHERE filters, then ORDER BY DESC sorts high to low.`,'JOIN & GROUP BY':`SELECT c.name, COUNT(o.id)\nFROM customers c\nJOIN orders o ON o.customer_id = c.id\nGROUP BY c.name;||JOIN links orders to customers and GROUP BY gives one row each.`};
Object.values(D).forEach(s=>s.ls.forEach(l=>{if(!l.sol)l.sol=SOL[l.t]||''}));

function quizR(qs){let sc=0,a=0;$('main').innerHTML='<div class="badge">'+D[S].name+' · Quiz</div><h2>Quick quiz</h2><div id="qs"></div><p id="sc"><b></b></p>';

 Object.keys(D).forEach(k=>{const ls=D[k].ls,d=ls.filter((_,i)=>done[k+i]).length,s=ls.filter((_,i)=>ST.seen[k+i]).length;tl+=ls.length;td+=d;ts+=s;
  c+=`<div class="task"><b>${D[k].name}</b> <span class="badge">${d}/${ls.length} completed · ${s}/${ls.length} started${ST.quiz[k]!=null?' · quiz '+ST.quiz[k]+'/3':''}</span><div class="bar" style="margin:6px 0 0"><i style="width:${d/ls.length*100}%"></i></div></div>`;
  const f=ls.findIndex((_,i)=>!done[k+i]);if(f>-1)nx.push([k,f]);
  ls.forEach((l,i)=>{const q=k+i;if(!done[q]&&(ST.fail[q]||ST.sol[q]))rev.push([k,i,l.t,ST.fail[q]||0,ST.sol[q]])})});
 const pc=n=>Math.round(n/tl*100),b=(k,i,t,x)=>`<button onclick="S='${k}';I=${i};H=0;render()">${D[k].name}: ${t}${x||''}</button>`;
 $('main').innerHTML=`<h2>My progress</h2><p class="badge">Saved automatically in this browser.</p><div class="task"><b>${pc(td)}% completed</b> · ${pc(ts)}% started · ${td} of ${tl} lessons<div class="bar" style="margin:6px 0 0"><i style="width:${pc(td)}%"></i></div></div>${c}<h3>Needs more practice</h3><div class="row">${rev.length?rev.map(r=>b(r[0],r[1],r[2],' ('+(r[3]?r[3]+' tries':'')+(r[3]&&r[4]?', ':'')+(r[4]?'solution viewed':'')+')')).join(''):'<span class="badge">Nothing yet. Lessons you try but have not passed will appear here.</span>'}</div><h3>Up next</h3><div class="row">${nx.length?nx.map(n=>b(n[0],n[1],D[n[0]].ls[n[1]].t)).join(''):'<span class="ok">All lessons completed!</span>'}</div><h3>Back up your progress</h3><p class="badge">Copy this code to keep it, or paste a saved code and press Load.</p><textarea id="pc" style="min-height:70px"></textarea><div class="row"><button onclick="loadCode()">Load code</button><button onclick="resetAll(this)">Reset progress</button></div><p id="pcm" class="bad"></p>`;
 $('pc').value=btoa(JSON.stringify({done,ST}))}
function loadCode(){try{const o=JSON.parse(atob($('pc').value.trim()));done=o.done||{};ST=Object.assign({seen:{},fail:{},sol:{},quiz:{}},o.ST);save();save2();render()}catch(e){$('pcm').textContent='That code is not valid.'}}
function resetAll(b){if(b.dataset.s){done={};ST={seen:{},fail:{},sol:{},quiz:{}};save();save2();render()}else{b.dataset.s=1;b.textContent='Click again to confirm'}}
function render(){
 $('lang').innerHTML=[['en','English'],['tl','Tagalog'],['tg','Taglish']].map(([k,n])=>`<button class="${k===LG?'on':''}" onclick="setLang('${k}')">${n}</button>`).join('');
 $('tabs').innerHTML=Object.keys(D).map(k=>`<button class="${k===S?'on':''}" onclick="S='${k}';I=0;H=0;render()">${D[k].name}</button>`).join('');
 const ls=D[S].ls,n=ls.filter((_,i)=>done[S+i]).length;let lv='',h='';
 ls.forEach((l,i)=>{if(l.lv!==lv){lv=l.lv;h+=`<div class="lv">${lv}</div>`}h+=`<button class="${i===I?'on':''}" onclick="I=${i};H=0;render()">${done[S+i]?'✓ ':''}${l.t}</button>`});
 $('side').innerHTML=h+`<div class="lv">Test yourself</div><button class="${I==='p'?'on':''}" onclick="I='p';render()">📊 My progress</button><button class="${I==='q'?'on':''}" onclick="I='q';render()">★ Quick quiz</button><div class="bar"><i style="width:${n/ls.length*100}%"></i></div><div class="badge" style="margin:4px 6px">${n} of ${ls.length} done</div>`;
 if(I==='q')return quiz();if(I==='p')return prog();const l=ls[I];ST.seen[S+I]=1;save2();
 $('main').innerHTML=`<div class="badge">${D[S].name} · ${l.lv}</div><h2 id="lt">${l.t}</h2><p id="lb">${l.b}</p><div class="badge" id="trs"></div><pre>${l.ex}</pre>
 <div class="task"><b>Your task:</b> <span id="lts">${l.task}</span></div>
 <textarea id="code" spellcheck="false" aria-label="Code editor"></textarea>
 <div class="row"><button class="on" onclick="go()">${S==='js'||S==='html'?'Run &amp; check':'Check my answer'}</button><button onclick="hint()">Guide me</button><button onclick="$('code').value=D[S].ls[I].st;$('out').innerHTML=''">Reset</button>${I<ls.length-1?'<button onclick="I++;H=0;render()">Next lesson →</button>':''}</div>
 <div class="guide" id="guide"><b>Guide:</b> stuck? Press “Guide me” for one step at a time.</div><div class="res" id="out"></div>`;
 $('code').value=l.st;applyTr(l);
 $('code').onkeydown=e=>{if(e.key==='Tab'){e.preventDefault();const t=e.target,p=t.selectionStart;t.setRangeText('  ',p,t.selectionEnd,'end')}};
}
function hint(){const l=D[S].ls[I];H=Math.min(H+1,l.h.length);$('guide').innerHTML='<b>Guide:</b>'+l.h.slice(0,H).map((x,i)=>`<p>${i+1}. <code></code></p>`).join('')+(H>=l.h.length?'<p><button onclick="sol()">Show solution</button></p>':'');
 [...$('guide').querySelectorAll('code')].forEach((c,i)=>c.textContent=((CUR||{}).h||l.h)[i]);}
async function go(){
 const l=D[S].ls[I],code=$('code').value;let res=[],extra='';
 l.c.forEach(([re,m],j)=>res.push([re.test(code),((CUR||{}).m||[])[j]||m]));
 if(S==='js'){
  const out=[],log=(...a)=>out.push(a.map(x=>typeof x==='object'?JSON.stringify(x):String(x)).join(' '));
  const delay=ms=>new Promise(r=>setTimeout(r,ms));
  try{const F=Object.getPrototypeOf(async function(){}).constructor;await new F('console','delay',code)({log},delay);await delay(250)}catch(e){out.push('Error: '+e.message)}
  const o=out.join('\n');extra=`<p><b>Output:</b></p><pre></pre>`;res.push([l.o.test(o),'Output looks correct']);
  $('out').innerHTML='';var outText=o;
 }
 const pass=res.every(r=>r[0]);
 if(pass&&!done[S+I]){done[S+I]=1;save()}
 if(!pass){ST.fail[S+I]=(ST.fail[S+I]||0)+1;save2()}
 let h=extra+res.map(r=>`<div class="${r[0]?'ok':'bad'}">${r[0]?'✓':'✗'} ${r[1]}</div>`).join('');
 h+=pass?`<p class="ok"><b>Lesson complete!</b>${l.exp?' Expected result: <code></code>':''}</p>`:'<p class="bad">Not quite yet. Try “Guide me”.</p>';
 if(S==='html')h+='<iframe sandbox title="Preview"></iframe>';
 $('out').innerHTML=h;
 if(S==='js')$('out').querySelector('pre').textContent=outText||'(no output)';
 if(pass&&l.exp)$('out').querySelector('code').textContent=((CUR||{}).e||l.exp);
 if(S==='html')$('out').querySelector('iframe').srcdoc=code;
 if(pass){const ls=D[S].ls,n=ls.filter((_,i)=>done[S+i]).length;document.querySelector('.bar i').style.width=n/ls.length*100+'%';document.querySelector('aside .badge').textContent=n+' of '+ls.length+' done'}
}
let LG='en',CUR=null,TC={};try{LG=localStorage.getItem('lp-lang')||'en';TC=JSON.parse(localStorage.getItem('lp-tr')||'{}')}catch(e){}
const UIT={'Learn & Practice':['Matuto at Magsanay','Learn at Practice'],'Your task:':['Gawain mo:','Task mo:'],'Run & check':['Patakbuhin at suriin','I-run at i-check'],'Check my answer':['Suriin ang sagot ko','I-check ang answer ko'],'Guide me':['Gabayan mo ako','Guide mo ako'],'Reset':['I-reset','I-reset'],'Next lesson →':['Susunod na aralin →','Next lesson →'],'Show solution':['Ipakita ang sagot','Show solution'],'Guide:':['Gabay:','Guide:'],'stuck? Press “Guide me” for one step at a time.':['nahihirapan? Pindutin ang “Gabayan mo ako” para sa isang hakbang bawat pindot.','stuck ka ba? I-press ang “Guide mo ako” para sa isang step at a time.'],'Lesson complete!':['Tapos na ang aralin!','Lesson complete na!'],'Not quite yet. Try “Guide me”.':['Hindi pa tama. Subukan ang “Gabayan mo ako”.','Hindi pa tama. Try mo ang “Guide mo ako”.'],'Output:':['Resulta:','Output:'],'Test yourself':['Subukan ang sarili','Test yourself'],'📊 My progress':['📊 Progreso ko','📊 My progress'],'★ Quick quiz':['★ Maikling quiz','★ Quick quiz'],'My progress':['Progreso ko','My progress'],'Quick quiz':['Maikling quiz','Quick quiz'],'Needs more practice':['Kailangan pang pagsanayan','Kailangan pa ng practice'],'Up next':['Susunod','Up next'],'Back up your progress':['I-back up ang progreso mo','I-back up ang progress mo'],'Load code':['I-load ang code','Load code'],'Reset progress':['I-reset ang progreso','I-reset ang progress'],'Saved automatically in this browser.':['Awtomatikong nase-save sa browser na ito.','Automatic na naka-save sa browser na ito.'],'Correct!':['Tama!','Tama!'],'Not quite. The right answer is highlighted.':['Hindi pa tama. Naka-highlight ang tamang sagot.','Hindi pa tama. Naka-highlight ang correct answer.'],'Basics':['Mga Batayan','Basics'],'Fundamentals':['Mga Pundasyon','Fundamentals'],'Advanced':['Mas Mataas na Antas','Advanced'],'🤖 Study assistant':['🤖 Katulong sa pag-aaral','🤖 Study assistant'],'Send':['Ipadala','Send'],'Explain this lesson':['Ipaliwanag ang aralin','Explain this lesson'],'Give me an example':['Bigyan ako ng halimbawa','Give me an example'],'Check my code':['Suriin ang code ko','Check my code'],'Hi! I am your study assistant. Ask me about this lesson or your code.':['Kumusta! Ako ang study assistant mo. Magtanong ka tungkol sa aralin o sa code mo.','Hi! Ako ang study assistant mo. Ask mo ako tungkol sa lesson o sa code mo.']};
function ui(){const w=document.createTreeWalker(document.body,NodeFilter.SHOW_TEXT);let n;while(n=w.nextNode()){if(n.parentNode.tagName==='SCRIPT')continue;const s=n._o||n.nodeValue,k=s.trim(),t=LG==='en'?null:T(k);if(t!=null||n._o){if(!n._o)n._o=n.nodeValue;const v=LG==='en'||t==null?n._o:n._o.replace(k,t);if(n.nodeValue!==v)n.nodeValue=v}}
 $('q').placeholder={en:'Ask anything…',tl:'Magtanong ng kahit ano…',tg:'Ask mo kahit ano…'}[LG]}
let qd=0;new MutationObserver(()=>{if(!qd){qd=1;requestAnimationFrame(()=>{qd=0;ui()})}}).observe(document.body,{childList:true,subtree:true});
function setLang(k){LG=k;try{localStorage.setItem('lp-lang',k)}catch(e){}document.documentElement.lang=k==='en'?'en':'fil';render();ui();loadTT()}
const clean=s=>String(s).replace(/<(?!\/?code>)[^>]*>/gi,'');
async function applyTr(l){CUR=null;if(LG==='en')return;const k=LG+S+I,st=$('trs');let r=TC[k];
 if(!r||!r.m){try{const sm=await claude.use('sample');if(!sm)return;st.textContent='Translating…';
  const who=LG==='tl'?'natural, simple Filipino (Tagalog)':'Taglish (the natural Tagalog-English mix Filipinos speak; keep technical terms in English)';
  r=await sm.json('Translate this beginner programming lesson into '+who+'. Keep HTML tags, entities like &lt; and anything inside <code> tags unchanged. Do not translate code. Return JSON only: {"t":title,"b":body,"task":task,"h":[hints],"m":[check messages],"w":why-it-works sentence,"e":expected result or empty string}.\n'+JSON.stringify({t:l.t,b:l.b,task:l.task,h:l.h,m:l.c.map(x=>x[1]),w:(l.sol||'').split('||')[1]||'',e:l.exp||''}));
  TC[k]=r;try{localStorage.setItem('lp-tr',JSON.stringify(TC))}catch(e){}}catch(e){if($('trs'))$('trs').textContent='Could not translate right now.';return}}
 if(k!==LG+S+I||!$('lt'))return;if(!Array.isArray(r.h))delete r.h;if(!Array.isArray(r.m))r.m=[];CUR=r;$('trs').textContent='';$('lt').textContent=r.t;$('lb').innerHTML=clean(r.b);$('lts').innerHTML=clean(r.task)}
Object.assign(UIT,{'\u2713 Output looks correct':['\u2713 Tama ang output','\u2713 Tama ang output'],'\u2717 Output looks correct':['\u2717 Tama ang output','\u2717 Tama ang output'],'Expected result:':['Inaasahang resulta:','Expected result:']});
let TTm={};try{TTm=JSON.parse(localStorage.getItem('lp-tt')||'{}')}catch(e){}
const T=k=>{if(!k)return null;if(Object.hasOwn(UIT,k))return UIT[k][LG==='tl'?0:1];const tt=TTm[LG]||{},m=k.match(/^(\u2713 )?(.+)$/);return m&&Object.hasOwn(tt,m[2])?(m[1]||'')+String(tt[m[2]]):null};
async function loadTT(){if(LG==='en'||TTm[LG])return;try{const sm=await claude.use('sample');if(!sm)return;const lg=LG,r=await sm.json('Translate these lesson titles into '+(lg==='tl'?'simple Filipino (Tagalog)':'Taglish (natural Tagalog-English mix; keep technical terms in English)')+'. Return JSON only: an object mapping each English title to its translation.\n'+JSON.stringify(Object.values(D).flatMap(s=>s.ls.map(l=>l.t))));if(r&&typeof r==='object'){TTm[lg]=r;try{localStorage.setItem('lp-tt',JSON.stringify(TTm))}catch(e){}ui()}}catch(e){}}
async function quiz(){const qs=QZ[S];if(LG==='en')return quizR(qs);const s=S,lg=LG,k='q'+lg+s;let r=TC[k];
 if(!r){$('main').innerHTML='<p class="badge">Translating\u2026</p>';try{const sm=await claude.use('sample');if(sm){r=await sm.json('Translate these quiz questions and answer options into '+(lg==='tl'?'simple Filipino (Tagalog)':'Taglish (natural Tagalog-English mix; keep technical terms in English)')+'. Keep code, symbols and keywords inside options unchanged and keep the same order. Return JSON only: an array of {"q":question,"o":[options]}.\n'+JSON.stringify(qs.map(x=>({q:x[0],o:x[1]}))));TC[k]=r;try{localStorage.setItem('lp-tr',JSON.stringify(TC))}catch(e){}}}catch(e){}}
 if(I!=='q'||S!==s||LG!==lg)return;
 const ok=Array.isArray(r)&&r.length===qs.length&&r.every((x,i)=>x&&x.q&&Array.isArray(x.o)&&x.o.length===qs[i][1].length);
 quizR(ok?qs.map((x,i)=>[String(r[i].q),r[i].o.map(String),x[2]]):qs)}
const CHAT=[];
async function ask(q){q=q||$('q').value.trim();if(!q)return;$('q').value='';
 const log=$('log'),add=(c,t)=>{const d=document.createElement('div');d.className='m '+c;d.textContent=t;log.append(d);log.scrollTop=log.scrollHeight;return d};
 add('u',q);const a=add('','…');
 try{const sm=await claude.use('sample');if(!sm){a.textContent='The assistant is not available here.';return}
  const l=(I!=='q'&&I!=='p')?D[S].ls[I]:null,lang={en:'English',tl:'Filipino (Tagalog)',tg:'Taglish (a natural mix of Tagalog and English)'}[LG];
  const ctx='You are a friendly tutor inside a beginner coding lesson site. Reply in '+lang+'. Be brief (under 120 words), encouraging, and give hints before full answers unless asked. Subject: '+D[S].name+'. '+(l?'Lesson: '+l.t+'. '+(l.b+' Task: '+l.task).replace(/<[^>]+>/g,'')+' Learner code:\n'+($('code')?$('code').value:''):'No lesson is open.');
  CHAT.push({role:'user',content:q});
  const msgs=CHAT.slice(-7);while(msgs[0].role!=='user')msgs.shift();
  const inp=msgs.map((m,i)=>i===msgs.length-1?{role:'user',content:ctx+'\n\nStudent question: '+m.content}:m);
  const r=await sm(inp,{cache:false,modelTier:'quick',onText:({text})=>{a.textContent=text;log.scrollTop=log.scrollHeight}});
  a.textContent=r.text;CHAT.push({role:'assistant',content:r.text})
 }catch(e){if(CHAT.length&&CHAT[CHAT.length-1].role==='user')CHAT.pop();a.textContent=e&&e.code==='rate_limited'?'Too many questions. Please wait a moment.':'Sorry, I could not answer right now.'}}
$('q').onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();ask()}};
render();ui();loadTT();
</script>
